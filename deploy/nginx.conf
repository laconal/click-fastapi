# Reverse proxy for the Click merchant integration demo.
# Copy to /etc/nginx/sites-available/fastapiclick, symlink into
# sites-enabled, then run `sudo certbot --nginx -d your-domain.com` -
# certbot will rewrite this file in place to add the TLS server block
# and the :80 -> :443 redirect. Don't hand-write the ssl_certificate
# lines yourself; let certbot do it so the paths always match.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
